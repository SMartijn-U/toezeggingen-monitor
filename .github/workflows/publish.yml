name: Genereer en publiceer RSS-feeds

on:
  workflow_dispatch:

  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v6

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Benodigde pakketten installeren
        run: pip install -r requirements.txt

      - name: Controleer Python-syntax
        run: python -m compileall -q src

      - name: Test ophalen actuele toezeggingen
        run: python src/get_toezeggingen.py

      - name: Test ophalen relevante documenten
        run: python src/get_kamerbrieven.py

      - name: Test downloaden en uitlezen document
        run: python src/test_document_download.py

      - name: Test kandidaatselectie
        run: python src/test_candidate_matching.py

      - name: Bouw kandidatenbestand
        run: python src/build_candidates.py

      - name: Bouw pilotbeoordelingen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/build_assessments.py

      - name: Valideer kandidaatselectie
        run: python src/validate_candidates.py

      - name: Upload analysebestanden
        uses: actions/upload-artifact@v4
        with:
          name: toezeggingenanalyse
          path: |
            data/candidates.json
            data/validation.json
            data/assessments.json
          retention-days: 7

      - name: RSS-feed genereren
        run: python src/generate_feed.py

      - name: GitHub Pages instellen
        uses: actions/configure-pages@v5

      - name: Controleer publicatiemap
        run: |
          echo "Bestanden die naar Pages gaan:"
          find public -maxdepth 3 -type f -print

      - name: Publicatiemap uploaden
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: public
          retention-days: 1
  deploy:
    needs: generate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publiceren op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
