name: Genereer en publiceer RSS-feeds

on:
  workflow_dispatch:

  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v6

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Benodigde pakketten installeren
        run: pip install -r requirements.txt

      - name: Test ophalen actuele toezeggingen
        run: python src/get_toezeggingen.py

      - name: RSS-feed genereren
        run: python src/generate_feed.py

      - name: GitHub Pages instellen
        uses: actions/configure-pages@v5

      - name: Controleer publicatiemap
        run: |
          echo "Bestanden die naar Pages gaan:"
          find public -maxdepth 3 -type f -print

      - name: Publicatiemap uploaden
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: public
          retention-days: 1

      - name: Publiceren op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
